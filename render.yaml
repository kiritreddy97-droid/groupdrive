# Render Blueprint: one click deploy of API + Postgres. See docs/08-cloud-deploy.md
services:
  - type: web
    name: groupdrive-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: groupdrive-db
          property: connectionString
databases:
  - name: groupdrive-db
    plan: free
