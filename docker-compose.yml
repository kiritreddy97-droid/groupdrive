services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      APP_ENV: dev
      ADMIN_PHONES: "9999999999"
      PAYMENT_WEBHOOK_SECRET: dev-only-webhook-secret
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
